[project]
name = "openet-sims"
version = "0.2.8"
authors = [
    { name = "Alberto Guzman", email = "aguzman@csumb.edu" },
]
maintainers = [
    { name = "Charles Morton", email = "charles.morton@dri.edu" },
]
description = "Earth Engine implementation of the SIMS model"
readme = "README.rst"
requires-python = ">=3.9"
keywords = ["SIMS", "OpenET", "Earth Engine", "Evapotranspiration", "Landsat"]
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "earthengine-api >= 1.5.2",
    "openet-core >= 0.7.0",
]

[project.urls]
"Homepage" = "https://github.com/Open-ET/openet-sims"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest",
    "pandas",
]

[tool.setuptools.package-data]
"openet.sims.tests" = ["*.csv"]

[tool.setuptools.packages.find]
# include = ["openet*"]
exclude = ["examples*"]
